<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denetim Düzeni DSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Kâğıt üstüne mürekkep: soğuk gri zemin, lacivert mürekkep, tek vurgu mavisi.
     Düzen: solda beş aşamalı ray, sağda o aşamanın paneli; özet en başta. */
  --paper: #f2f3f0;
  --panel: #ffffff;
  --ink: #1b2130;
  --muted: #5b6375;
  --rule: #d6d9de;
  --accent: #2d49a6;
  --ok: #2c7a56;
  --warn: #a8701a;
  --bad: #b2283f;
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141b; --panel: #191e28; --ink: #e5e8ef; --muted: #9aa3b6; --rule: #2b3241;
    --accent: #8fa6ff; --ok: #5cc08f; --warn: #e0a64a; --bad: #f0778b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141b; --panel: #191e28; --ink: #e5e8ef; --muted: #9aa3b6; --rule: #2b3241;
  --accent: #8fa6ff; --ok: #5cc08f; --warn: #e0a64a; --bad: #f0778b; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 22px; letter-spacing: -0.01em; }
h2 { font-size: 26px; line-height: 1.15; }
h3 { font-size: 18px; }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 24px; border-bottom: 1px solid var(--rule); background: var(--panel); }
.top .sub { color: var(--muted); font-size: 13px; }
.top .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--rule); white-space: nowrap; }
.pill.demo { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.pill.live { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.btn { border: 1px solid var(--rule); background: var(--panel); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 62px); }
.rail { border-right: 1px solid var(--rule); padding: 18px 0; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; }
.rail a { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 4px; padding: 9px 16px; color: var(--ink); text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
.rail a .no { font-family: var(--display); font-size: 15px; color: var(--muted); }
.rail a .st { font-size: 11px; color: var(--muted); }
.rail a[aria-current="page"] { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); font-weight: 600; }
.rail .sep { height: 1px; background: var(--rule); margin: 10px 16px; }
main { padding: 26px 32px 60px; display: grid; gap: 22px; align-content: start; min-width: 0; }
.lede { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; display: grid; gap: 14px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
.tile .v { font-family: var(--display); font-size: 28px; line-height: 1.1; }
.tile .d { font-size: 13px; color: var(--muted); }
.eq { font-size: 12px; color: var(--muted); }

.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 26px; align-items: start; }
.verdict { display: grid; gap: 10px; }
.verdict .code { font-family: var(--display); font-size: 64px; line-height: .95; color: var(--accent); }
.verdict .name { font-family: var(--display); font-size: 30px; line-height: 1.1; }
.verdict .def { color: var(--muted); font-size: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }

.rank { display: grid; gap: 6px; }
.rrow { display: grid; grid-template-columns: 38px minmax(0, 1fr) 72px; align-items: center; gap: 10px; }
.rrow .c { font-weight: 700; font-size: 13px; }
.bar { position: relative; height: 28px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 5%, transparent); overflow: hidden; }
.bar > span { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.bar > em { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 13px; white-space: nowrap; }
.rrow.first .bar > span { background: var(--accent); }
.rrow.first .bar > em { color: var(--panel); font-weight: 600; }
.rrow.out .bar { height: auto; min-height: 28px; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--bad) 12%, transparent) 0 6px, transparent 6px 12px); }
.rrow.out .bar > em { position: static; transform: none; display: block; padding: 5px 10px; white-space: normal; color: var(--bad); }
.rrow .val { text-align: right; font-size: 13px; }
.gate { border-top: 2px dashed color-mix(in srgb, var(--bad) 60%, transparent); margin-top: 6px; padding-top: 6px; font-size: 12px; color: var(--bad); font-weight: 600; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.n, th.n { text-align: right; }
.scroll { overflow-x: auto; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.chip.mute { color: var(--muted); background: color-mix(in srgb, var(--ink) 7%, transparent); }
tr.hl td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
tr.Lrow td:first-child { box-shadow: inset 3px 0 var(--warn); }

.mini { display: grid; gap: 3px; }
.mini .b { height: 7px; border-radius: 2px; background: var(--accent); }
.mini .b.m0 { background: color-mix(in srgb, var(--ink) 30%, transparent); }
.mini .b.m1 { background: color-mix(in srgb, var(--warn) 80%, transparent); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -2px; }

.drop { border: 2px dashed var(--rule); border-radius: 10px; padding: 22px; display: grid; gap: 8px; justify-items: start; }
.drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 18px; }
.form label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
.form label small { font-weight: 400; color: var(--muted); }
.form input, .form select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
.log { font-size: 12px; color: var(--muted); }
.notice { border-left: 3px solid var(--warn); padding: 8px 12px; background: color-mix(in srgb, var(--warn) 8%, transparent); font-size: 13px; }
.notice.err { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.progress { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
svg text { fill: var(--muted); font: 11px var(--body); }
svg .axis { stroke: var(--rule); }

@media (max-width: 1000px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hero, .grid2 { grid-template-columns: 1fr; } .form { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
  .rail { position: static; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 0; max-height: none; }
  .rail a { grid-template-columns: auto auto; border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; padding: 10px 12px; }
  .rail a .st, .rail .sep { display: none; }
  .rail a[aria-current="page"] { border-bottom-color: var(--accent); }
  main { padding: 18px 16px 48px; }
  .tiles, .form { grid-template-columns: 1fr; }
  .verdict .code { font-size: 48px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

function viewSummary() {
  const P = S.P, t = T(), lg = P.legal;

  const adm = lg.adm.filter(Boolean).length;
  const order = P.alts.map((a, i) => i).sort((a, b) => (P.V[b] ?? -1) - (P.V[a] ?? -1));
  const vmax = Math.max(...P.V.filter((v) => v !== null));
  const rows = order.filter((i) => lg.adm[i]).map((i, k) => {
    const c = P.alts[i].code;
    return `<div class="rrow ${k === 0 ? "first" : ""}"><span class="c" style="color:${colorOf(c)}">${c}</span>
      <div class="bar"><span style="width:${(P.V[i] / vmax * 100).toFixed(1)}%"></span><em>${esc(altName(c))}</em></div>
      <span class="val">${f(P.V[i])}</span></div>`;
  }).join("");
  const outs = P.alts.map((a, i) => i).filter((i) => !lg.adm[i]).map((i) => {
    const c = P.alts[i].code;
    return `<div class="rrow out"><span class="c">${c}</span><div class="bar"><em>${esc(altName(c))} · ${t.excluded(f(lg.F[i], 2), f(P.params.tau_F, 2))}</em></div><span class="val">—</span></div>`;
  }).join("");
  const d = P.diagnostics;
  const v2 = P.voice.M2;
  const bm = P.benchmarks ? Object.values(P.benchmarks.methods) : [];
  const nSame = bm.filter((m) => m.same_top).length;
  const oatValid = P.oat.filter((o) => o.top_changed !== null);
  const oatSame = oatValid.filter((o) => !o.top_changed).length;
  const lt = Object.values(P.legal_treatments); const ltSame = lt.filter((x) => !x.differs).length;
  const fTop = P.dirichlet ? P.dirichlet.f[ti] : null;
  const chip = (ok) => `<span class="chip ${ok ? "ok" : "warn"}">${ok ? "✓" : "!"}</span>`;
  return `
  <section class="hero card">
    <div class="verdict">
      <span class="k eq">${t.summaryTitle}</span>
      <span class="code">${esc(P.top || "—")}</span>
      <span class="name">${esc(P.top ? altName(P.top) : "")}</span>
      <p class="def">${esc(ti < 0 ? "" : S.lang === "tr" ? P.alts[ti].definition : (EN_DEFS[P.top] || ""))}</p>
      <div class="facts">
        <span class="pill">${t.facts.V}: ${f(P.V[ti])}</span>
        <span class="pill">${t.facts.alpha}: ${f(lg.alpha[ti])}</span>
        <span class="pill">${t.facts.adm}: ${t.of(adm, P.alts.length)}</span>
      </div>
      ${P.tie ? `<div class="notice">${t.tie}</div>` : ""}
    </div>
    <div class="rank" aria-label="${t.rankTitle}">
      <h3>${t.rankTitle}</h3>
      ${rows}
      ${outs ? `<div class="gate">${t.gateLine}</div>${outs}` : ""}
      <p class="eq">${t.rankNote}</p>
    </div>
  </section>
  <section class="tiles">
    <div class="tile"><span class="k">${t.tiles.lps}</span><span class="v">${pct(d.M2.LPS)}</span><span class="d">${t.lpsD(pct(d.M1.LPS), pct(d.M2.LPS))}</span><span class="eq">${eqL("23")}</span></div>
    <div class="tile"><span class="k">${t.tiles.cb}</span><span class="v">${f(d.M2.C_beta, 2)}</span><span class="d">${t.cbD(f(d.M1.C_beta, 2), f(d.M2.C_beta, 2))}</span><span class="eq">${eqL("24")}</span></div>
    <div class="tile"><span class="k">${t.tiles.cop}</span><span class="v">${pct(d.CoP)}</span><span class="d">${t.copD}</span><span class="eq">${eqL("25")}</span></div>
    <div class="tile"><span class="k">${t.tiles.voice}</span><span class="v">${v2.s_star !== null ? f(v2.s_star, 2) : t.voiceNone(f(P.params.voice_s_max, 2))}</span><span class="d">${t.voiceD(f(P.L_share, 3), esc(v2.i_L || "—"), v2.s_stable !== null && v2.s_stable !== undefined ? f(v2.s_stable, 2) : t.voiceNone(f(P.params.voice_s_max, 2)), pct(v2.share))}</span><span class="eq">${eqL("26–28", true)}</span></div>
  </section>
  <section class="card">
    <h3>${t.robust}</h3>
    <table><tbody>
      <tr><td>${chip(nSame === bm.length)}</td><td>${t.rb.bench}</td><td class="n">${t.of(nSame, bm.length)}</td></tr>

    </tbody></table>
  </section>`;
}

function bindData() {

// ------------------------------------------------------------------ motor (Web Worker + Pyodide)
let worker = null, bootPromise = null;
function setEngine(state, msg) { S.engine = state; if (msg !== undefined) S.engineMsg = msg; const el = $("#eng-msg"); if (el) { const t = T(); el.textContent = state === "done" ? S.engineMsg : ({ idle: t.eng.idle, booting: t.eng.booting, pkgs: t.eng.pkgs, ready: t.eng.ready, running: t.eng.running, fail: t.eng.fail })[state]; } const b = $("#run"); if (b) b.disabled = ["booting", "pkgs", "running"].includes(state) || !S.files.length; }
function setProgress(p) { S.progress = p; const el = $("#prog"); if (el) el.style.width = p + "%"; }
function bootEngine() {
  if (bootPromise) return bootPromise;
  bootPromise = new Promise((resolve, reject) => {
    try { worker = new Worker("worker.js"); }
    catch (err) { reject(err); return; }
    worker.onerror = (e) => { reject(new Error(e.message || "worker")); };
    worker.onmessage = (e) => {
      const m = e.data;
      if (m.type === "diag") { S.diag.push(m.text); const el = $("#diag"); if (el) el.textContent = S.diag.join("\n"); return; }
      if (m.type === "status" && m.key === "pkgs") { setEngine("pkgs"); setProgress(35); }
      if (m.type === "status" && m.key === "ready") { setEngine("ready"); setProgress(55); resolve(); }
      if (m.type === "error" && S.engine !== "running") reject(new Error(m.text));
      handleRunMessage(m);
    };
    setEngine("booting"); setProgress(10);
    S.diag = []; S.bootStart = Date.now();
    setTimeout(() => { if (["booting", "pkgs"].includes(S.engine)) { S.slow = true; render(); } }, 120000);
    worker.postMessage({ type: "boot", files: PY_FILES, wheels: WHEELS });
  });
  bootPromise.catch(() => { bootPromise = null; });
  return bootPromise;
}
let t0 = 0;
function handleRunMessage(m) {
  if (S.engine !== "running") return;
  if (m.type === "progress") { const mm = m.text.match(/(\d+)\/(\d+)/); if (mm) setProgress(60 + 38 * (+mm[1] / +mm[2])); }
  if (m.type === "error") { S.error = m.text; setEngine("fail"); render(); }
  if (m.type === "result") {
    const P = JSON.parse(m.json);
    if (P.error) { S.error = P.error; setEngine("ready"); render(); return; }
    S.P = P; S.source = S.filesAreDemo ? "demo" : "uploaded"; S.error = null;
    S.xlsx = m.xlsx || null; S.json = m.js || null;
    setProgress(100); setEngine("done", T().eng.done(f((performance.now() - t0) / 1000, 1)));
    location.hash = "#summary"; render();
  }
}
async function runEngine() {
  if (!S.files.length) return;
  S.error = null; t0 = performance.now();
  try { await bootEngine(); }
  catch (err) { S.error = T().eng.fail + " (" + (err.message || err) + ")"; setEngine("fail"); render(); return; }
  setEngine("running"); setProgress(60);
  const p = S.params;
  worker.postMessage({ type: "run", files: S.files.map((x) => ({ name: x.name, buf: x.buf.slice(0) })), draws: p.draws, source: S.filesAreDemo ? "demo" : "uploaded",
    params: { tau_F: p.tau_F, theta: p.theta, gamma_percentile: p.gamma_percentile, delta: p.delta, power_mapping: p.power_mapping } });
}

// ------------------------------------------------------------------ ses eşiği
function viewVoice() {
  const P = S.P, t = T(), g = P.grid;
  const W = 760, H = 170, x0 = 52, x1 = W - 16, rowsY = { M2: 34, M1: 86 }, hRow = 34;
  const sx = (s) => x0 + (x1 - x0) * (s / g[g.length - 1]);
  const cw = (x1 - x0) / g.length;
  let cells = "";
  for (const m of ["M2", "M1"]) {
    const tops = P.voice[m].tops || [];
    tops.forEach((c, k) => { cells += `<rect x="${(sx(g[k]) - cw / 2).toFixed(1)}" y="${rowsY[m]}" width="${(cw + .6).toFixed(1)}" height="${hRow}" fill="${colorOf(c)}"><title>${m} · s = ${f(g[k], 2)} · ${c}</title></rect>`; });
    cells += `<text x="${x0 - 8}" y="${rowsY[m] + hRow / 2 + 4}" text-anchor="end">${t.voiceRows[m]}</text>`;
    const ss = P.voice[m].s_star; if (ss !== null) cells += `<path d="M${sx(ss).toFixed(1)} ${rowsY[m] - 4} l-5 -7 h10 z" fill="var(--ink)"><title>s*</title></path>`;
    const st = P.voice[m].s_stable; if (st !== null && st !== undefined) cells += `<path d="M${sx(st).toFixed(1)} ${rowsY[m] - 4} l-5 -7 h10 z" fill="none" stroke="var(--ink)"><title>s^st</title></path>`;
  }
  const ticks = [0, .1, .2, .3, .4, .5, .6].filter((v) => v <= g[g.length - 1] + 1e-9).map((v) => `<line class="axis" x1="${sx(v)}" x2="${sx(v)}" y1="124" y2="128"/><text x="${sx(v)}" y="140" text-anchor="middle">${f(v, 1)}</text>`).join("");
  const now = P.L_share; const nowLine = now <= g[g.length - 1] ? `<line x1="${sx(now)}" x2="${sx(now)}" y1="22" y2="124" stroke="var(--ink)" stroke-dasharray="3 3"/><text x="${sx(now) + 4}" y="18">${t.nowMark} ${f(now, 3)}</text>` : "";
  const used = [...new Set([...(P.voice.M2.tops || []), ...(P.voice.M1.tops || [])])].sort();
  const gt = t.voiceNone(f(g[g.length - 1], 2));
  const sv = (x) => (x === null || x === undefined) ? gt : f(x, 2);
  const vtab = `<div class="scroll"><table><thead><tr>${t.voiceH.map((h, i) => `<th class="${i > 1 ? "n" : ""}">${h}</th>`).join("")}</tr></thead><tbody>
    ${["M2", "M1"].map((m) => `<tr class="${m === "M2" ? "hl" : ""}"><td>${t.models[m]}</td><td>${esc(P.voice[m].i_L || "—")}</td><td class="n">${sv(P.voice[m].s_star)}</td><td class="n">${sv(P.voice[m].s_stable)}</td><td class="n">${pct(P.voice[m].share)}</td></tr>`).join("")}</tbody></table></div>`;
  return `<section class="card"><h2>${t.voiceTitle}</h2>
    <p class="lede">${t.voiceLede(`<strong>${esc(P.voice.M2.i_L || "—")}</strong> ${esc(P.voice.M2.i_L ? altName(P.voice.M2.i_L) : "")}`, f(now, 3))}</p>
    ${vtab}
    <div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${t.voiceTitle}">${cells}<line class="axis" x1="${x0}" x2="${x1}" y1="124" y2="124"/>${ticks}${nowLine}
      <text x="${(x0 + x1) / 2}" y="${H - 4}" text-anchor="middle">${t.voiceAxis}</text></svg></div>
    <div class="legend">${used.map((c) => `<span><i style="background:${colorOf(c)}"></i>${c} ${esc(altName(c))}</span>`).join("")}<span>▼ s*</span><span>▽ s^st</span></div>
    ${P.voice.M2.note ? `<div class="notice">${esc(P.voice.M2.note)}</div>` : ""}</section>`;
}

$("#dl-json").addEventListener("click", () => save(S.source === "demo" ? "DSS_Ozet_ornek.json" : "DSS_Ozet.json", S.json));
render();
if (/[?&]selftest\b/.test(location.search)) {
  S.params.draws = 0;
  S.files = Object.entries(DEMO_FORMS).map(([name, b]) => ({ name, buf: b64ToBytes(b).buffer })); S.filesAreDemo = true;
  location.hash = "#data"; runEngine();
  const iv = setInterval(() => {
    if (S.engine === "done") { document.title = "SELFTEST OK " + S.P.top + " " + JSON.stringify(S.P.voice.M2.s_star) + " " + S.engineMsg; clearInterval(iv); }
    if (S.engine === "fail" || S.error) { document.title = "SELFTEST FAIL " + (S.error || ""); clearInterval(iv); }
  }, 500);
}
// claude.ai içinde indirme yeteneği; başka bir sunucuda (ör. GitHub Pages) tarayıcının olağan indirmesi.
const anchorDownloads = { save: async ({ filename, data }) => {
  const url = URL.createObjectURL(new Blob([data])); const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
} };
(function wireDownloads(tries) {
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then((d) => { S.downloads = d; render(); }).catch(() => {});
  } else if (tries > 0) setTimeout(() => wireDownloads(tries - 1), 500);
  else { S.downloads = anchorDownloads; render(); }
})(10);
</script>
</body>
